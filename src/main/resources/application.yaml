spring:
  application:
    name: order-service
  profiles:
    group:
      "local": "local, default-datasource, default-db-management, default-redis, eureka, openfeign, actuator, kafka, base-url"
      "docker": "docker, default-datasource, default-db-management, default-redis, eureka, openfeign, actuator, kafka, base-url"
      "prod": "prod, prod-datasource, prod-db-management, prod-cache-redis, eureka, openfeign, actuator, kafka, base-url"
    active: ${PROFILE_ACTIVE:local}

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
